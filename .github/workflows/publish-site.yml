name: publish-site

on:
  push:
    branches: [arena/a5d44250-qzeshjkgf]

permissions:
  contents: write

jobs:
  buildjob:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: build
        working-directory: game
        run: |
          npm ci
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: game/dist/index.html
      - name: publish to gh-pages
        env:
          T: ${{ github.token }}
        run: |
          git clone --depth 1 --branch gh-pages "https://x-access-token:$T@github.com/hm3282039-art/qzeshjkgf.git" /tmp/gh
          cp "$GITHUB_WORKSPACE/game/dist/index.html" /tmp/gh/index.html
          cp "$GITHUB_WORKSPACE/game/dist/index.html" /tmp/gh/test.html
          cp "$GITHUB_WORKSPACE/game/dist/index.html" "/tmp/gh/test-$(echo "$GITHUB_SHA" | cut -c1-7).html" 
          cd /tmp/gh
          git add -A
          git -c user.name=arena-bot -c user.email=arena-bot@users.noreply.github.com commit -m "deploy v2.6 kael" || echo nothing-new
          git push origin HEAD:gh-pages
