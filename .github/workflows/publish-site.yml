name: publish-site

on:
  push:
    branches: [arena/a5d44250-qzeshjkgf]

jobs:
  buildjob:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: build
        working-directory: game
        run: |
          npm ci
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: game/dist/index.html
