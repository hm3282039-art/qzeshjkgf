name: deploy-pages

on:
  push:
    branches: [arena/a5d44250-qzeshjkgf]

permissions:
  contents: read
  pages: write
  id-token: write
  administration: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: build
        working-directory: game
        run: |
          npm ci
          npm run build
      - name: autorise cette branche a deployer (environnement github-pages)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/environments/github-pages/deployment-branch-policies" \
            -d "{\"name\":\"$GITHUB_REF_NAME\"}" \
          || curl -sf -X DELETE -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/environments/github-pages/deployment-branch-policies/69658649" \
          || echo "regle impossible a modifier, on tente quand meme"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: game/dist
      - id: deployment
        uses: actions/deploy-pages@v4
