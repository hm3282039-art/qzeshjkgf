<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Légendes de la Tour Infinie</title>
</head>
<body>
  <div id="loader">
    <svg class="rune-ring" viewBox="0 0 200 200" aria-hidden="true">
      <defs><path id="rp" d="M100,100 m-78,0 a78,78 0 1,1 156,0 a78,78 0 1,1 -156,0" /></defs>
      <g class="r1" fill="none" stroke="#d8b45a">
        <circle cx="100" cy="100" r="92" stroke-width="0.6" />
        <circle cx="100" cy="100" r="86" stroke-width="0.3" stroke-dasharray="2 3" />
        <text font-size="9" fill="#d8b45a" stroke="none" letter-spacing="4"><textPath href="#rp">ᚠᚢᚦᚨᚱᚲ ᚷᚹᚺᚾᛁᛃ ᛇᛈᛉᛊᛏᛒ ᛖᛗᛚᛜᛞᛟ ᚠᚢᚦᚨᚱᚲ ᚷᚹᚺᚾᛁᛃ</textPath></text>
      </g>
      <g class="r2" fill="none" stroke="#c2183c" stroke-width="0.6">
        <circle cx="100" cy="100" r="64" />
        <polygon points="100,38 154,131 46,131" />
        <polygon points="100,162 46,69 154,69" />
      </g>
    </svg>
    <div class="loader-inner">
      <div class="loader-title">Légendes de la<br /><span>Tour Infinie</span></div>
      <div class="loader-bar"><i id="loader-fill"></i></div>
      <div class="loader-text" id="loader-text">Invocation du monde…</div>
      <div id="loader-error" role="alert">
        <div class="le-title">Le chargement est bloqué</div>
        <div class="le-detail"></div>
        <div class="le-actions">
          <button class="le-retry" id="loader-retry" type="button">Recharger le jeu</button>
          <button class="le-safe" id="loader-safe" type="button">Mode compatibilité</button>
        </div>
        <div class="le-hint">Le mode compatibilité désactive les effets de lumière : à essayer si le jeu reste bloqué.</div>
      </div>
      <noscript><div class="le-noscript">Ce jeu a besoin de JavaScript pour fonctionner.</div></noscript>
      <div class="loader-ver">v2.0.0 · 22/10</div>
    </div>
  </div>
  <div id="game"></div>
  <div id="ui"></div>
  <script>
    // Filet de sécurité indépendant du module : il prouve si le JavaScript tourne.
    window.__gameBooted = false;
    setTimeout(function () {
      if (window.__gameBooted) return;
      var box = document.getElementById('loader-error');
      var txt = document.getElementById('loader-text');
      var bar = document.querySelector('.loader-bar');
      if (!box) return;
      box.classList.add('on');
      if (bar) bar.style.display = 'none';
      if (txt) txt.style.display = 'none';
      var t = box.querySelector('.le-title');
      var d = box.querySelector('.le-detail');
      if (t) t.textContent = 'Le jeu n\'a pas démarré';
      if (d) d.textContent = 'Le code du jeu n\'a pas pu s\'exécuter dans ce navigateur. Recharge la page (Ctrl + Maj + R). Si cela recommence, essaie le mode compatibilité ou un autre navigateur (Chrome, Edge, Firefox à jour).';
    }, 20000);
  </script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
